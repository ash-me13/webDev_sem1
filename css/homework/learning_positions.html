<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position</title>
    <style>
        html {
            background: url(p1.jpeg) no-repeat center center fixed;
            background-size: cover;
            background: linear-gradient()
        }

        #name1 {
            position: absolute;
            left: 5px;
            bottom: 10px;
            font-size: 25px;
            color: rgb(8, 113, 243);
        }

        #name2 {
            position: absolute;
            right: 5px;
            bottom: 10px;
            font-size: 25px;
            color: rgb(8, 113, 243);
        }

        #name3 {
            position: absolute;
            top: 50%;
            left: 50%;
            
            color: rgb(8, 113, 243);
            font-size: 25px;
        }

        #name4 {
            position: absolute;
            right: 5px;
            top: 10px;
            font-size: 25px;
            color: rgb(8, 113, 243);
        }

        #name5 {
            position: absolute;
            right: 50%;
            bottom: 10px;
            font-size: 25px;
            color: rgb(8, 113, 243);
        }

        #name6 {
            position: absolute;
            right: 50%;
            top: 0;
            font-size: 25px;
            color: rgb(8, 113, 243);
        }

        #name7 {
            position: absolute;
            right: 0;
            top: 50%;
            font-size: 25px;
            color: rgb(8, 113, 243);
        }

        #name8 {
            position: absolute;
            left: 0;
            bottom: 50%;
            font-size: 25px;
            color: rgb(8, 113, 243);
        }

        #name9 {
            position: absolute;
            left: 5px;
            top: 10px;
            font-size: 25px;
            color: rgb(8, 113, 243);
        }

    </style>
</head>

<body>
    <div class="divs">
        <div id="name1">Anup Gupta</div>
        <div id="name2">Anup Gupta</div>
        <div id="name3">Anup Gupta</div>
        <div id="name4">Anup Gupta</div>
        <div id="name5">Anup Gupta</div>
        <div id="name6">Anup Gupta</div>
        <div id="name7">Anup Gupta</div>
        <div id="name8">Anup Gupta</div>
        <div id="name9">Anup Gupta</div>
    </div>

</body>

</html>
